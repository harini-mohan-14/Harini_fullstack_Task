<!DOCTYPE html>
<html>
<head>
    <title>Login and Register</title>

    <style>
        body{
            font-family: Arial;
            background-color: lightblue;
            text-align: center;
            margin-top: 40px;
        }

        .page{
            display:none;
        }

        #login{
            display:block;
        }

        input{
            width:250px;
            padding:8px;
            margin:8px;
        }

        button{
            padding:10px 20px;
            margin:10px;
        }

        .eye{
            cursor:pointer;
        }
    </style>
</head>

<body>

<!-- PAGE 1 : LOGIN -->
<div id="login" class="page">
    <h1>LOGIN</h1>

    <input type="email" id="loginEmail" placeholder="User Name"><br>

    <input type="password" id="loginPassword" placeholder="Password">
    <span class="eye" onclick="showPassword()">👁</span><br>

    <button onclick="signIn()">SIGN IN</button>

    <button onclick="openRegister()">SIGN UP</button>

    <h3 id="msg" style="color:red;"></h3>
</div>

<!-- PAGE 2 : REGISTER -->
<div id="register" class="page">
    <h1>REGISTER</h1>

    <input type="text" placeholder="First Name"><br>

    <input type="text" placeholder="Last Name"><br>

    <input type="text" placeholder="ID (Alphanumeric)"><br>

    <input type="email" id="regEmail" placeholder="Email"><br>

    <input type="password" id="regPassword" placeholder="Create Password"><br>

    <button onclick="createAccount()">CREATE ACCOUNT</button>
</div>

<!-- PAGE 3 : SUCCESS -->
<div id="success" class="page">
    <h1 style="color:green;">LOGIN SUCCESSFULLY ✅</h1>

    <h2>Welcome!</h2>

    <button onclick="backLogin()">BACK TO LOGIN</button>
</div>

<script>
let email="";
let password="";

function openRegister(){
    login.style.display="none";
    register.style.display="block";
}

function createAccount(){
    email=regEmail.value;
    password=regPassword.value;

    register.style.display="none";
    login.style.display="block";

    alert("Account Created Successfully!");
}

function signIn(){
    if(loginEmail.value==email && loginPassword.value==password){
        login.style.display="none";
        success.style.display="block";
    }
    else{
        msg.innerHTML="❌ Doesn't Register";
    }
}

function backLogin(){
    success.style.display="none";
    login.style.display="block";
}

function showPassword(){
    let p=document.getElementById("loginPassword");
    if(p.type=="password")
        p.type="text";
    else
        p.type="password";
}
</script>

</body>
</html>
